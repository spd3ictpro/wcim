name: Build & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./wcim-laravel

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env file
        run: copy .env.example .env

      - name: Create SQLite database
        run: New-Item -ItemType File -Path "database/database.sqlite" -Force

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-fileinfo

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Bundle NativePHP app
        run: php artisan native:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wcim-installer
          path: dist/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.exe
